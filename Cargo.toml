[workspace.lints.rust]
unsafe_code = "deny"
# Apple's `ld` linker on macOS/arm64 warns when a binary's `__eh_frame` section
# exceeds 16MB (compact-unwind-table format limit) — a platform-specific linker
# artifact of the `zeph` binary's size, not a code defect. `build.warnings = "deny"`
# (.cargo/config.toml, #5891) denies this via `#[warn(linker_messages)]` like any
# other lint, unconditionally failing `cargo build --features full` on macOS/arm64.
# `build.warnings` has no category-granular equivalent (verified against the Cargo
# 1.97 reference: it is a plain string, not a table) so the lint is allowed here
# instead. Note `linker_messages` is a single all-or-nothing rustc lint over every
# warning the linker writes to stderr, not just this eh_frame case — there is no
# per-message granularity, so this allow is workspace-wide (via each crate's
# existing `[lints] workspace = true` inheritance) and applies on every platform,
# including CI's Linux runners, where it is a no-op today only because Linux's
# linker never emits the eh_frame warning specifically, not because the lint is
# scoped to it. Accepted tradeoff: linker *errors* still fail the build; only
# non-fatal linker diagnostics are suppressed. All other rustc/clippy/rustdoc
# warnings remain denied. See #5895.
# `tests/workspace_lints.rs` guards this line's presence/value on every PR via
# Linux CI (ci.yml) — it only verifies the config value, not actual linker
# behavior. Verifying the real linker behavior on macOS/arm64 still requires
# either a manual `ci-non-linux.yml` workflow_dispatch run or the next tagged
# `release.yml` build. See #5961.
linker_messages = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[package]
name = "zeph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lightweight AI agent with hybrid inference, skills-first architecture, and multi-channel I/O"
readme = "README.md"

[features]
default = ["scheduler", "sqlite"]

# === Use-case bundles ===
desktop = ["tui", "deep-link", "session"]
ide     = ["acp", "acp-http"]
server  = ["gateway", "a2a", "otel", "prometheus", "session"]
chat    = ["discord", "slack"]
ml      = ["candle", "pdf"]
full    = ["desktop", "ide", "server", "chat", "pdf", "scheduler", "classifiers", "profiling", "sandbox", "gonka", "cocoon", "testing", "registry"]
testing = ["zeph-llm/testing"]
sandbox    = ["zeph-tools/sandbox"]
bench      = ["dep:zeph-bench"]

# === Individual feature flags ===
deep-link = ["zeph-common/deep-link", "zeph-config/deep-link"]
a2a = ["dep:zeph-a2a", "zeph-a2a?/server", "zeph-a2a?/ibct", "zeph-a2a?/card-signing", "zeph-config/card-signing"]
acp = ["dep:zeph-acp", "zeph-acp/unstable-session-delete", "zeph-acp/unstable-session-fork", "zeph-acp/unstable-session-resume", "zeph-acp/unstable-session-usage", "zeph-acp/unstable-elicitation", "zeph-acp/unstable-llm-providers", "zeph-acp/unstable-logout", "zeph-acp/unstable-auth-methods", "zeph-acp/unstable-message-id", "zeph-acp/unstable-session-add-dirs"]
acp-http = ["acp", "dep:axum", "zeph-acp/acp-http"]
candle = ["zeph-llm/candle", "zeph-core/candle"]
classifiers = ["candle", "zeph-llm/classifiers", "zeph-sanitizer/classifiers", "zeph-core/classifiers"]
metal = ["candle", "zeph-llm/metal", "zeph-core/metal"]
cuda = ["candle", "zeph-llm/cuda", "zeph-core/cuda"]
tui = ["dep:zeph-tui"]
discord = ["zeph-channels/discord"]
slack = ["zeph-channels/slack"]
gateway = ["dep:zeph-gateway"]
prometheus = ["gateway", "dep:prometheus-client", "zeph-gateway/prometheus"]
scheduler = ["dep:zeph-scheduler", "dep:blake3", "dep:cron", "dep:schemars", "zeph-core/scheduler", "zeph-scheduler/daemon", "zeph-memory/scheduler"]
# Skill/plugin marketplace discovery (spec-045, #5869): gates zeph-plugins' `marketplace`
# module (skills.sh registry client). CLI args and RegistryConfig parsing always compile.
registry = ["zeph-plugins/registry"]
# Session persistence, event-log replay, and `zeph serve` (spec-068, #5343). Independent of `acp`:
# `acp` gates ACP protocol transports, `session` gates the persistence CLI verbs and `zeph serve`.
# The `zeph-session` crate/agent-loop dual-write is always compiled and config-gated
# (`[session] enabled`). `dep:axum` backs `zeph serve-sessions`'s HTTP/SSE API — see `src/serve/`.
session = ["dep:axum", "dep:tokio-stream", "zeph-common/http-middleware"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
pdf = ["zeph-memory/pdf"]
profiling = [
    "dep:tracing-chrome",
    "dep:sysinfo",
    "zeph-core/profiling",
    "zeph-core/sysinfo",
    "zeph-llm/profiling",
    "zeph-memory/profiling",
    "zeph-tools/profiling",
    "zeph-skills/profiling",
    "zeph-mcp/profiling",
    "zeph-channels/profiling",
    "zeph-tui?/profiling",
]
profiling-alloc = ["profiling", "zeph-core/profiling-alloc"]
profiling-pyroscope = ["profiling", "otel", "dep:pprof"]
# Database backend selection — mutually exclusive. Default includes sqlite, so plain
# `cargo build`/`cargo build --features full` (no --no-default-features) always get a
# working sqlite build. `full` itself does NOT include a backend — it is
# backend-agnostic so it can be combined with either.
# NOTE: --all-features activates both, triggering compile_error! in zeph-db.
# For a PostgreSQL build, default features must be disabled (the plain default
# always includes sqlite, and Cargo features are additive-only — sqlite cannot be
# "overridden" by requesting postgres on top of it):
#   cargo build --no-default-features --features full,postgres
# For the equivalent explicit sqlite build:
#   cargo build --no-default-features --features full,sqlite
# Or simply `cargo build --features full` to rely on the default sqlite backend.
gonka = ["zeph-llm/gonka", "zeph-core/gonka"]
cocoon = ["zeph-llm/cocoon", "zeph-core/cocoon", "zeph-tui?/cocoon"]
index = ["zeph-core/index"]
sqlite = [
    "zeph-db/sqlite",
    "zeph-memory/sqlite",
    "zeph-mcp/sqlite",
    "zeph-index/sqlite",
    "zeph-orchestration/sqlite",
    "zeph-tools/sqlite",
    "zeph-scheduler?/sqlite",
    "zeph-core/sqlite",
    "zeph-durable/sqlite",
    "zeph-session/sqlite",
    "zeph-agent-persistence/sqlite",
    "zeph-agent-context/sqlite",
    "zeph-sanitizer/sqlite",
    "zeph-skills/sqlite",
    "zeph-subagent/sqlite",
    "zeph-acp?/sqlite",
    "zeph-bench?/sqlite",
    "zeph-tui?/sqlite",
    "zeph-experiments/sqlite",
]
postgres = [
    "zeph-db/postgres",
    "zeph-memory/postgres",
    "zeph-mcp/postgres",
    "zeph-index/postgres",
    "zeph-orchestration/postgres",
    "zeph-tools/postgres",
    "zeph-scheduler?/postgres",
    "zeph-core/postgres",
    "zeph-durable/postgres",
    "zeph-session/postgres",
    "zeph-agent-persistence/postgres",
    "zeph-agent-context/postgres",
    "zeph-sanitizer/postgres",
    "zeph-skills/postgres",
    "zeph-subagent/postgres",
    "zeph-acp?/postgres",
    "zeph-bench?/postgres",
    "zeph-tui?/postgres",
    "zeph-experiments/postgres",
]

