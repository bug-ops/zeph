[package]
name = "zeph-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "MCP client with multi-server lifecycle and Qdrant tool registry for Zeph"
readme = "README.md"

[features]
profiling = []
sqlite = ["zeph-db/sqlite", "zeph-memory/sqlite", "zeph-tools/sqlite"]
postgres = ["zeph-db/postgres", "zeph-memory/postgres", "zeph-tools/postgres"]
default = ["sqlite"]
mock = []
# Enables test utilities and testcontainers for PostgreSQL integration tests.
test-utils = ["dep:testcontainers-modules", "postgres"]

[dependencies]
async-trait.workspace = true
blake3.workspace = true
dashmap.workspace = true
futures.workspace = true
glob.workspace = true
http.workspace = true
lru.workspace = true
open.workspace = true
parking_lot.workspace = true
rand.workspace = true
qdrant-client = { workspace = true, features = ["serde"] }
regex.workspace = true
reqwest = { workspace = true, features = ["rustls", "json"] }
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "sync", "time", "rt", "net", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v5"] }
zeph-common.workspace = true
zeph-config.workspace = true
zeph-db.workspace = true
zeph-llm.workspace = true
zeph-memory.workspace = true
zeph-tools.workspace = true
# See https://github.com/bug-ops/zeph (workspace dependencies only contain versions)

[dev-dependencies]
rmcp = { workspace = true, features = ["server"] }
testcontainers = { workspace = true, features = ["watchdog"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-test.workspace = true
wiremock.workspace = true
zeph-llm = { workspace = true, features = ["testing"] }

[lints]
workspace = true
