[package]
name = "zeph-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Pure-data configuration types for Zeph"
readme = "README.md"

[features]
default = []
# Marker feature only (no deps) — mirrors `zeph-a2a/card-signing` so `Config::validate()`
# can fail fast when `card_trust_policy = require` is set without the crypto feature
# compiled in anywhere in the binary. MUST be enabled together with `zeph-a2a/card-signing`
# (root `Cargo.toml`'s `a2a` feature line pairs them) — nothing else enforces the pairing, so
# splitting them would make `require` falsely fail config validation even when the crypto in
# zeph-a2a actually works (#5928).
card-signing = []
deep-link = []

[dependencies]
dirs.workspace = true
ordered-float = { workspace = true, features = ["serde"] }
regex.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
url.workspace = true
zeph-common.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tracing-test.workspace = true

[lints]
workspace = true
