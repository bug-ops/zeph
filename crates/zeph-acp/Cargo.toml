[package]
name = "zeph-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "ACP (Agent Client Protocol) server for IDE embedding"
readme = "README.md"

[features]
default = ["sqlite"]
# `zeph-memory`/`zeph-db` require a backend to compile; default to `sqlite` so this crate
# builds in isolation, and expose `postgres` for PostgreSQL deployments (#4956).
sqlite = ["zeph-memory/sqlite", "zeph-session/sqlite", "zeph-core/sqlite", "zeph-mcp/sqlite", "zeph-tools/sqlite"]
postgres = ["zeph-memory/postgres", "zeph-session/postgres", "zeph-core/postgres", "zeph-mcp/postgres", "zeph-tools/postgres"]
acp-http = ["dep:axum", "dep:blake3", "dep:dashmap", "dep:async-stream", "dep:tower-http", "dep:subtle", "dep:tower"]
unstable-session-fork = ["agent-client-protocol/unstable_session_fork"]
# renamed from unstable_session_usage in acp 0.14.0; Usage struct + PromptResponse.usage remain gated
unstable-session-usage = ["agent-client-protocol/unstable_end_turn_token_usage"]
unstable-elicitation = ["dep:agent-client-protocol-schema", "agent-client-protocol-schema/unstable_elicitation", "agent-client-protocol/unstable_elicitation"]
unstable-llm-providers = ["dep:agent-client-protocol-schema", "agent-client-protocol-schema/unstable_llm_providers"]
unstable-auth-methods = ["agent-client-protocol/unstable_auth_methods"]
# Wires the real $/cancel_request protocol notification onto the existing internal cancel_signal.
# Cancellation itself was stabilized upstream in acp 1.1.0 (no feature gate needed there anymore);
# this stays a local opt-in gate for the zeph-acp integration. Not in `default` — see #5362.
unstable-cancel-request = []

[dependencies]
agent-client-protocol = { workspace = true }
agent-client-protocol-schema = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
axum = { workspace = true, features = ["ws"], optional = true }
base64.workspace = true
blake3 = { workspace = true, optional = true }
chrono = { workspace = true, features = ["std", "clock"] }
dashmap = { workspace = true, optional = true }
dirs.workspace = true
futures.workspace = true
glob.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["rustls", "stream"] }
rmcp.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shell-words.workspace = true
subtle = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "sync", "macros", "rt", "test-util"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
toml.workspace = true
tower = { workspace = true, features = ["util"], optional = true }
tower-http = { workspace = true, features = ["cors", "limit"], optional = true }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeph-commands.workspace = true
zeph-common.workspace = true
zeph-config.workspace = true
zeph-core.workspace = true
zeph-llm.workspace = true
zeph-mcp.workspace = true
zeph-memory.workspace = true
zeph-session = { workspace = true, default-features = false }
zeph-tools.workspace = true
# See https://github.com/bug-ops/zeph (workspace dependencies only contain versions)

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
tempfile.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect"] }
tower = { workspace = true, features = ["util"] }
zeph-llm = { workspace = true, features = ["testing"] }

[lints]
workspace = true
