[package]
name = "zeph-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Plugin packaging, installation, and management for Zeph"
readme = "README.md"

[dependencies]
dirs.workspace = true
flate2.workspace = true
futures.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
toml.workspace = true
tracing.workspace = true
walkdir = { workspace = true }
zeph-common.workspace = true
zeph-config.workspace = true
zeph-skills.workspace = true
zeph-tools.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-test.workspace = true
wiremock.workspace = true

[features]
# `zeph-skills`/`zeph-tools` (and transitively `zeph-db`) require a backend to compile;
# default to `sqlite` so this crate builds in isolation, and expose `postgres` for
# PostgreSQL deployments (#4956).
default = ["sqlite"]
sqlite = ["zeph-skills/sqlite", "zeph-tools/sqlite"]
postgres = ["zeph-skills/postgres", "zeph-tools/postgres"]
# Exposes `marketplace::mock::MockRegistryClient` outside `#[cfg(test)]` so downstream crates
# (the `zeph` binary) can drive it from their own `dev-dependencies`. Mirrors `zeph-vault`'s
# `mock` feature.
mock = []

[lints]
workspace = true
