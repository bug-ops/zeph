[package]
name = "zeph-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Cron-based periodic task scheduler with SQLite persistence for Zeph"
readme = "README.md"

[features]
sqlite = ["zeph-db/sqlite", "zeph-durable/sqlite"]
postgres = ["zeph-db/postgres", "zeph-durable/postgres"]
default = ["sqlite"]

[dependencies]
chrono = { workspace = true, features = ["std", "clock"] }
cron.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rustix = { workspace = true, features = ["fs", "process", "std"] }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing.workspace = true
zeph-common.workspace = true
zeph-config.workspace = true
zeph-db.workspace = true
zeph-durable.workspace = true
# See https://github.com/bug-ops/zeph (workspace dependencies only contain versions)

[dev-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
