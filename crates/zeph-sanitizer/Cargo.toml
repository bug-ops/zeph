[package]
name = "zeph-sanitizer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Content sanitization, exfiltration guard, PII filtering, and quarantine for Zeph"
readme = "README.md"

[dependencies]
image = { workspace = true, features = ["jpeg", "png", "gif", "webp"] }
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
zeph-common.workspace = true
zeph-config.workspace = true
zeph-llm.workspace = true
zeph-memory.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tokio-stream.workspace = true
toml.workspace = true
zeph-llm = { workspace = true, features = ["testing"] }

[features]
# `zeph-memory` (and transitively `zeph-db`) needs exactly one backend selected to
# compile. Default to `sqlite` so `cargo {check,test,doc} -p zeph-sanitizer` works in
# isolation; the workspace build unifies on the backend chosen by the binary (#4956).
default = ["sqlite"]
sqlite = ["zeph-memory/sqlite"]
postgres = ["zeph-memory/postgres"]
classifiers = ["zeph-llm/classifiers"]

[lints]
workspace = true
