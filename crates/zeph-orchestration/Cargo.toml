[package]
name = "zeph-orchestration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Task orchestration: DAG execution, failure propagation, and persistence for Zeph"
readme = "README.md"

[dependencies]
blake3.workspace = true
chrono = { workspace = true, features = ["clock"] }
dirs.workspace = true
parking_lot.workspace = true
rand.workspace = true
rand_distr.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

zeph-common.workspace = true
zeph-config.workspace = true
zeph-db.workspace = true
zeph-durable.workspace = true
zeph-llm = { workspace = true, optional = true }
zeph-subagent.workspace = true

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
testcontainers = { workspace = true, features = ["watchdog"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zeph-llm = { workspace = true, features = ["testing"] }
zeph-memory.workspace = true

[features]
sqlite = ["zeph-db/sqlite", "zeph-durable/sqlite", "zeph-memory/sqlite", "zeph-subagent/sqlite"]
postgres = ["zeph-db/postgres", "zeph-durable/postgres", "zeph-memory/postgres", "zeph-subagent/postgres"]
llm-planning = ["dep:zeph-llm"]
# Enables test utilities and testcontainers for PostgreSQL integration tests.
# Implies `llm-planning`: the only test-utils-gated suite (postgres_integration.rs)
# exercises `PlanCache`, which lives behind that feature.
test-utils = ["dep:testcontainers-modules", "postgres", "llm-planning"]
default = ["sqlite"]

[lints]
workspace = true
