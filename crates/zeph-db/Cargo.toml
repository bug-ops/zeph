[package]
name = "zeph-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Database abstraction layer for Zeph (SQLite and PostgreSQL backends)"
readme = "README.md"

[features]
# sqlite and postgres are mutually exclusive; enabling both is a compile_error! (see src/lib.rs).
# default = ["sqlite"] ensures standalone `cargo check -p zeph-db` and rust-analyzer work.
# The root workspace Cargo.toml also enables sqlite via its own default feature set.
default = ["sqlite"]
sqlite = ["sqlx/sqlite", "dep:zeph-common"]
postgres = ["sqlx/postgres"]
# Enables test utilities and testcontainers for PostgreSQL integration tests.
test-utils = ["dep:testcontainers", "postgres"]

[dependencies]
# "macros" required for sqlx::migrate! in driver implementations.
sqlx = { workspace = true, features = ["macros", "migrate", "runtime-tokio", "tls-rustls"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeph-common = { workspace = true, optional = true }

# testcontainers' `watchdog` feature pulls in signal-hook's `iterator` module,
# which is not built on Windows (signal-hook gates it `cfg(not(windows))`),
# breaking builds with `test-utils` enabled on windows-latest CI.
[target.'cfg(not(windows))'.dependencies]
testcontainers = { workspace = true, features = ["watchdog"], optional = true }

[target.'cfg(windows)'.dependencies]
testcontainers = { workspace = true, optional = true }

[dev-dependencies]
regex = { workspace = true }
tempfile.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
