[package]
name = "zeph-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Database abstraction layer for Zeph (SQLite and PostgreSQL backends)"
readme = "README.md"

[features]
# sqlite and postgres are mutually exclusive; enabling both is a compile_error! (see src/lib.rs).
# default = ["sqlite"] ensures standalone `cargo check -p zeph-db` and rust-analyzer work.
# The root workspace Cargo.toml also enables sqlite via its own default feature set.
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
# Enables test utilities and testcontainers for PostgreSQL integration tests.
test-utils = ["dep:testcontainers", "dep:testcontainers-modules", "postgres"]

[dependencies]
# "macros" required for sqlx::migrate! in driver implementations.
sqlx = { workspace = true, features = ["macros", "migrate", "runtime-tokio", "tls-rustls"] }
testcontainers = { workspace = true, features = ["watchdog"], optional = true }
testcontainers-modules = { workspace = true, features = ["postgres"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeph-common.workspace = true

[dev-dependencies]
regex = { workspace = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
