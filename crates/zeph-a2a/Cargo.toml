[package]
name = "zeph-a2a"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "A2A protocol client and server with agent discovery for Zeph"
readme = "README.md"

[features]
# MUST be enabled together with zeph-config's `card-signing` marker feature (root Cargo.toml's
# `a2a` feature line pairs them) — zeph-config's Config::validate() gates
# card_trust_policy = "require" on that marker as a proxy for whether the crypto here is
# actually compiled in. Splitting them would make `require` falsely fail config validation
# even when this crate's crypto path works (#5928).
card-signing = ["dep:p256", "dep:serde_json_canonicalizer"]
ibct = ["dep:hmac", "dep:sha2"]
server = ["dep:axum", "dep:tower", "dep:tower-http", "zeph-common/http-middleware"]

[dependencies]
axum = { workspace = true, optional = true }
base64.workspace = true
chrono = { workspace = true, features = ["clock"] }
eventsource-stream.workspace = true
futures.workspace = true
futures-core.workspace = true
hex.workspace = true
hmac = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_json_canonicalizer = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tokio-stream.workspace = true
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["limit", "trace"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
zeph-common.workspace = true
# See https://github.com/bug-ops/zeph (workspace dependencies only contain versions)

[dev-dependencies]
axum = { workspace = true, features = ["macros"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true
wiremock.workspace = true

[lints]
workspace = true
