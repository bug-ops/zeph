[package]
name = "zeph-subagent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Subagent management: spawning, grants, transcripts, and lifecycle hooks for Zeph"
readme = "README.md"

[features]
sqlite = ["zeph-durable/sqlite", "zeph-sanitizer/sqlite", "zeph-skills/sqlite", "zeph-tools/sqlite"]
postgres = ["zeph-durable/postgres", "zeph-sanitizer/postgres", "zeph-skills/postgres", "zeph-tools/postgres"]
default = ["sqlite"]

[dependencies]
dirs.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_norway.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
zeph-common.workspace = true
zeph-config.workspace = true
zeph-durable.workspace = true
zeph-llm.workspace = true
zeph-sanitizer.workspace = true
zeph-skills.workspace = true
zeph-tools.workspace = true
zeph-worktree.workspace = true
zeroize.workspace = true

[dev-dependencies]
indoc.workspace = true
proptest.workspace = true
schemars.workspace = true
serial_test.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
zeph-llm = { workspace = true, features = ["testing"] }

[lints]
workspace = true
