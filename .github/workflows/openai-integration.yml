name: openai-integration

# Runs ignored OpenAI integration tests that require a live API key.
# Manual-only: consumes OpenAI API tokens, so not triggered on push.

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose test output (--no-capture)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: openai-integration
  cancel-in-progress: false

jobs:
  openai-integration:
    name: OpenAI Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check secrets
        id: secrets-check
        env:
          API_KEY: ${{ secrets.ZEPH_OPENAI_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "Skipping: ZEPH_OPENAI_API_KEY not configured"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.secrets-check.outputs.skip == 'false'

      - uses: taiki-e/install-action@badb8c3638e0b773c6c17a6025c2306a8f1c4303 # nextest
        if: steps.secrets-check.outputs.skip == 'false'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.secrets-check.outputs.skip == 'false'
        with:
          cache-targets: "false"
          shared-key: "openai-integration"

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.secrets-check.outputs.skip == 'false'

      - name: Run OpenAI ignored tests
        if: steps.secrets-check.outputs.skip == 'false'
        env:
          ZEPH_OPENAI_API_KEY: ${{ secrets.ZEPH_OPENAI_API_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          EXTRA=""
          if [ "${{ inputs.debug }}" = "true" ]; then
            EXTRA="--no-capture"
          fi
          cargo nextest run \
            --config-file .github/nextest.toml \
            --cargo-profile ci \
            --workspace \
            --features full \
            --run-ignored ignored-only \
            -E 'package(zeph-llm) and test(openai)' \
            $EXTRA
